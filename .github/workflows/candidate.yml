name: Candidate

concurrency:
  group: candidate
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: On dev
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.SHORT }}
    steps:
      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Candidate runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Short sha
        id: sha
        run: echo "SHORT=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

  prerelease:
    name: The dev-build pre-release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Build bundles
        run: node build.js

      - name: Checksum the bundles
        working-directory: dist
        run: sha256sum -- *.zip *.xpi > SHA256SUMS

      - name: Replace the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/dev-build" 2>/dev/null || true
          gh release create dev-build --prerelease \
            --target "${{ github.sha }}" \
            --title "dev-build ${{ needs.check.outputs.short }}" \
            --notes "Built on demand from dev at ${{ github.sha }} on $(date -u +%Y-%m-%d). Not a release: it is replaced by the next candidate and carries no support." \
            dist/*.zip dist/*.xpi dist/SHA256SUMS
