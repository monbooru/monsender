name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  check:
    name: The version is ready
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Release runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.md)"
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION.md must be strict SemVer 'vMAJOR.MINOR.PATCH', got: $version"
            exit 1
          fi
          heading="$(awk '/^## /{print $2; exit}' CHANGELOG.md)"
          if [ "$heading" != "[$version]" ]; then
            echo "::error::CHANGELOG.md's newest entry is $heading, VERSION.md says $version."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$version" | grep -q "refs/tags/$version"; then
            echo "::error::$version is already a tag; bump VERSION.md and CHANGELOG.md first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Verify is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=verify&per_page=50" --jq '.check_runs[].conclusion')"
          if [ -z "$conclusions" ]; then
            echo "::error::Verify has not run on ${{ github.sha }}; wait for it, or run it by hand first."
            exit 1
          fi
          if ! echo "$conclusions" | grep -qx success; then
            echo "::error::Verify is not green on ${{ github.sha }}: $(echo "$conclusions" | tr '\n' ' ')"
            exit 1
          fi

  build:
    name: Bundles
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Build bundles
        run: node build.js

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundles
          path: |
            dist/monsender-chrome-*.zip
            dist/monsender-firefox-*.xpi
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    needs: [check, build]
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bundles
          path: dist

      - name: Extract the changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > /tmp/latest_changelog.md
          if [ ! -s /tmp/latest_changelog.md ]; then
            echo "::error::CHANGELOG.md has no entry under a '## ' heading."
            exit 1
          fi

      - name: Write the snapshot on main and the tag
        run: |
          git config user.name leqwin
          git config user.email 216300216+leqwin@users.noreply.github.com
          rm -rf /tmp/snap
          mkdir -p /tmp/snap
          exclude=/dev/null
          [ -f .github/release-exclude ] && exclude=.github/release-exclude
          rsync -a --exclude='.git/' --exclude='dist/' --exclude-from="$exclude" ./ /tmp/snap/
          tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
          parent=""
          if git fetch -q origin main 2>/dev/null; then
            parent="-p $(git rev-parse FETCH_HEAD)"
          fi
          commit="$(git commit-tree $tree $parent -m "release: $VERSION" -m "$(cat /tmp/latest_changelog.md)")"
          git push origin "$commit:refs/heads/main"
          git push origin "$commit:refs/tags/$VERSION"
          echo "main and $VERSION at $commit"

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body_path: /tmp/latest_changelog.md
          files: |
            dist/monsender-chrome-*.zip
            dist/monsender-firefox-*.xpi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install the web-ext toolchain
        run: npm run tooling:webext

      - name: Build the unpacked bundles
        if: github.repository == 'monbooru/monsender'
        run: node build.js

      - name: Submit the Firefox bundle to AMO
        if: github.repository == 'monbooru/monsender'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign
