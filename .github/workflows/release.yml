name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  check:
    name: The version is ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: On dev
        run: |
          if [ "${{ github.ref }}" != refs/heads/dev ]; then
            echo "::error::Release runs on dev, not on ${{ github.ref_name }}."
            exit 1
          fi

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION.md)"
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION.md must be strict SemVer 'vMAJOR.MINOR.PATCH', got: $version"
            exit 1
          fi
          heading="$(awk '/^## /{print $2; exit}' CHANGELOG.md)"
          if [ "$heading" != "[$version]" ]; then
            echo "::error::CHANGELOG.md's newest entry is $heading, VERSION.md says $version."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          remote_tag="$(g ls-remote --tags origin "refs/tags/$version")"
          if [ -n "$remote_tag" ]; then
            rm -rf /tmp/snap
            mkdir -p /tmp/snap
            exclude=/dev/null
            [ -f .github/release-exclude ] && exclude=.github/release-exclude
            rsync -a --exclude='.git/' --exclude='dist/' --exclude-from="$exclude" ./ /tmp/snap/
            tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
            g fetch -q --depth 1 origin "refs/tags/$version"
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$tree" ]; then
              echo "::error::$version is already a tag; bump VERSION.md and CHANGELOG.md first."
              exit 1
            fi
            echo "::notice::$version is already tagged on this commit's snapshot: resuming its publication."
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Verify is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=verify&filter=all&per_page=100" --jq '.check_runs | max_by(.id) | if . == null then "" else (.conclusion // .status) end')"
          if [ -z "$newest" ]; then
            echo "::error::Verify has not run on $GITHUB_SHA; wait for it, or run it by hand first."
            exit 1
          fi
          if [ "$newest" != success ]; then
            echo "::error::Verify's newest run on $GITHUB_SHA is not green: $newest"
            exit 1
          fi

  build:
    name: Bundles
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Build bundles
        run: node build.js

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundles
          path: |
            dist/monsender-chrome-*.zip
            dist/monsender-firefox-*.xpi
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bundles
          path: dist

      - name: Extract the changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > /tmp/latest_changelog.md
          if [ ! -s /tmp/latest_changelog.md ]; then
            echo "::error::CHANGELOG.md has no entry under a '## ' heading."
            exit 1
          fi

      - name: Write the snapshot on main and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name leqwin
          git config user.email 216300216+leqwin@users.noreply.github.com
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          rm -rf /tmp/snap
          mkdir -p /tmp/snap
          exclude=/dev/null
          [ -f .github/release-exclude ] && exclude=.github/release-exclude
          rsync -a --exclude='.git/' --exclude='dist/' --exclude-from="$exclude" ./ /tmp/snap/
          tree="$(cd /tmp/snap && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=/tmp/snap add -A && GIT_INDEX_FILE=/tmp/snap.index git --git-dir="$GITHUB_WORKSPACE/.git" write-tree)"
          remote_tag="$(g ls-remote --tags origin "refs/tags/$VERSION")"
          if [ -n "$remote_tag" ]; then
            g fetch -q origin "refs/tags/$VERSION"
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$tree" ]; then
              echo "::error::$VERSION is already a tag on another tree; nothing pushed."
              exit 1
            fi
            echo "main and $VERSION already hold this snapshot at $(git rev-parse 'FETCH_HEAD^{commit}')"
            exit 0
          fi
          parent=()
          commit=""
          if g fetch -q origin main 2>/dev/null; then
            tip="$(git rev-parse FETCH_HEAD)"
            parent=(-p "$tip")
            if [ "$(git rev-parse "$tip^{tree}")" = "$tree" ] && [ "$(git log -1 --format=%s "$tip")" = "release: $VERSION" ]; then
              commit="$tip"
              echo "main already holds this snapshot at $commit"
            fi
          fi
          if [ -z "$commit" ]; then
            commit="$(git commit-tree "$tree" "${parent[@]}" -m "release: $VERSION" -m "$(cat /tmp/latest_changelog.md)")"
            g push origin "$commit:refs/heads/main"
          fi
          g push origin "$commit:refs/tags/$VERSION"
          echo "main and $VERSION at $commit"

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body_path: /tmp/latest_changelog.md
          files: |
            dist/monsender-chrome-*.zip
            dist/monsender-firefox-*.xpi
          overwrite_files: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install the web-ext toolchain
        if: github.repository == 'monbooru/monsender'
        run: npm run tooling:webext

      - name: Build the unpacked bundles
        if: github.repository == 'monbooru/monsender'
        run: node build.js

      - name: Submit the Firefox bundle to AMO
        if: github.repository == 'monbooru/monsender'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -o pipefail
          if ! npm run sign 2>&1 | tee /tmp/sign.log; then
            if ! grep -qF "Version ${VERSION#v} already exists." /tmp/sign.log; then
              exit 1
            fi
            echo "::notice::AMO already has ${VERSION#v}; nothing to submit."
          fi

      - name: Submit the Chrome bundle to the Chrome Web Store
        if: github.repository == 'monbooru/monsender'
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: jhiaelblkhpfbmaijnlbmhpcjhghnack
        run: |
          if [ -z "$CWS_SERVICE_ACCOUNT" ] || [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "::error::CWS_SERVICE_ACCOUNT and CWS_PUBLISHER_ID must be set to submit to the Chrome Web Store."
            exit 1
          fi
          ver="${VERSION#v}"
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          jq -r .private_key <<<"$CWS_SERVICE_ACCOUNT" > "$key"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          claims="$(jq -cn --arg iss "$(jq -r .client_email <<<"$CWS_SERVICE_ACCOUNT")" --argjson now "$(date +%s)" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/chromewebstore", aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}' | b64url)"
          sig="$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key" | b64url)"
          token="$(curl -fsS https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d "assertion=$header.$claims.$sig" | jq -r .access_token)"
          echo "::add-mask::$token"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID"
          cws() {
            local code
            code="$(curl -sS -o /tmp/cws.json -w '%{http_code}' -H "Authorization: Bearer $token" "$@")"
            if [ "$code" -ge 400 ]; then
              echo "::error::Chrome Web Store answered $code: $(cat /tmp/cws.json)"
              exit 1
            fi
          }
          status() { cws "https://chromewebstore.googleapis.com/v2/$item:fetchStatus"; }
          status
          known="$(jq -r --arg v "$ver" '[.publishedItemRevisionStatus, .submittedItemRevisionStatus][] | select(.distributionChannels[]?.crxVersion == $v) | .state' /tmp/cws.json | head -n1)"
          case "$known" in
            PENDING_REVIEW|STAGED|PUBLISHED|PUBLISHED_TO_TESTERS)
              echo "::notice::The Chrome Web Store already has $ver ($known); nothing to submit."
              exit 0 ;;
            REJECTED)
              echo "::error::The Chrome Web Store rejected $ver; see the dashboard."
              exit 1 ;;
          esac
          pending="$(jq -r 'select(.submittedItemRevisionStatus.state == "PENDING_REVIEW") | .submittedItemRevisionStatus.distributionChannels[0].crxVersion // "a version"' /tmp/cws.json)"
          if [ -n "$pending" ]; then
            echo "::error::$pending is still in review on the Chrome Web Store; cancel it in the dashboard or wait for the review, then re-run."
            exit 1
          fi
          cws -X POST -T "dist/monsender-chrome-$VERSION.zip" "https://chromewebstore.googleapis.com/upload/v2/$item:upload"
          state="$(jq -r .uploadState /tmp/cws.json)"
          for _ in $(seq 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            status
            state="$(jq -r .lastAsyncUploadState /tmp/cws.json)"
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "::error::The upload to the Chrome Web Store ended $state: $(cat /tmp/cws.json)"
            exit 1
          fi
          cws -X POST "https://chromewebstore.googleapis.com/v2/$item:publish"
          echo "::notice::Chrome Web Store: $ver submitted, $(jq -r .state /tmp/cws.json)."
